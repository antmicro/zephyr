adapter driver ftdi
ftdi_vid_pid 0x0403 0x6043

# SWD on Channel A
ftdi_channel 0

# Use SWD, SCDIO and SWCLK default mapping will be used
transport select swd

# Use 100kHz, can be increased if it is working stable
adapter speed 100

# Pin mapping:
# ADBUS0 = SWCLK
# ADBUS1 = SWDIO_OUT
# ADBUS2 = SWDIO_IN
# ADBUS4 = nRESET

ftdi layout_init 0x0010 0x0013
# 0x0013 direction mask:
#   bit0 = 1 (SWCLK output)
#   bit1 = 1 (SWDIO_OUT output)
#   bit2 = 0 (SWDIO_IN input)
#   bit3 = 0 (Not used)
#   bit4 = 1 (nRESET output)
#   bit5 = 0 (Not used)
#   bit6 = 0 (Not used)
#   bit7 = 0 (Not used)
# 0x0010 initial state:
#   bit0 = 0 (SWCLK low)
#   bit1 = 0 (SWDIO_OUT low)
#   bit2 = 0 (SWDIO_IN low)
#   bit3 = 0 (Not used low)
#   bit4 = 1 (nRESET high)
#   bit5 = 0 (Not used low)
#   bit6 = 0 (Not used low)
#   bit7 = 0 (Not used low)

# SWD_EN not mapped on physical pin
ftdi layout_signal SWD_EN -data 0

# SWDIO_OE not mapped on physical pin
ftdi layout_signal SWDIO_OE -data 0

# nSRST mapped to ADBUS4
ftdi layout_signal nSRST -data 0x0010 -oe 0x0010

reset_config srst_only connect_assert_srst
